name: attendance_scanner
description: Flutter desktop and mobile scanner for event attendee and meeting participant check-in.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.4
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  mobile_scanner: ^7.1.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.3

flutter:
  uses-material-design: true
  generate: true
